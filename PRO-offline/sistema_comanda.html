<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartComanda PRO</title>
<style>

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}h2{font-size:18px}
.lg{display:flex;gap:12px;color:var(--m);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.mesa{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:14px;background:#1e293b66;border:1px solid var(--b);font-weight:400}
.mesa b{font-size:16px}.mesa span{color:var(--m)}.mesa strong{color:var(--g);margin-top:4px}.mesa .tm{align-self:flex-start}

.k.done{opacity:.6}.kt{display:flex;justify-content:space-between;align-items:center}.mt{background:var(--p);border:1px solid var(--b);padding:2px 10px;border-radius:8px}
.k .tm{font-size:20px;font-weight:700}.k ul{list-style:none;border-top:1px solid #1e293b;padding-top:8px;margin:6px 0;display:grid;gap:4px;font-weight:600;flex:1}
.fin{text-align:center;color:var(--g);font-weight:700}
.seg{display:flex;gap:4px;background:var(--p);padding:4px;border-radius:12px;border:1px solid var(--b)}.seg button{background:transparent;color:var(--m);padding:6px 12px}.seg .on{background:#4f46e5;color:#fff}
.pc{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:14px;display:grid;gap:6px}.r2{display:flex;justify-content:space-between;align-items:center}.pr{color:var(--g);font-size:16px}
dialog{background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:16px;padding:20px;width:min(560px,92vw);margin:auto}
dialog::backdrop{background:#020617bb}dialog h3{margin-bottom:12px}
label{display:grid;gap:4px;margin-bottom:12px;color:var(--m);font-size:12px}
input[type=text],input[type=number],input:not([type]){background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:9px 12px;color:#fff;font:inherit}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--t)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.row.w{flex-wrap:wrap;justify-content:flex-start}
#pL{display:grid;gap:8px;max-height:55vh;overflow-y:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#0f172a;padding:10px 18px;border-radius:12px;font-weight:600;z-index:99;display:none}
@media(max-width:900px){#v-salao{flex-direction:column}#painel{width:auto;align-self:stretch}}
</style></head><body>
<header><div class="brand"><span class="logo">🍽</span><div><h1>SmartComanda <small>PRO</small></h1><small>Restaurante &amp; Café Central</small></div></div><nav id="tabs"></nav><div id="hr"></div></header>

<div class="row"><button class="g" data-a="x">Fechar</button></div></dialog>
<div id="toast" role="status"></div>

try{fh=await idb('get','fh');if(fh){if(await fh.queryPermission({mode:'readwrite'})==='granted'){sheet='ok';push()}else sheet='reauth'}}catch(e){}hdr()}
async function connect(){try{if(fh&&sheet==='reauth'){if(await fh.requestPermission({mode:'readwrite'})!=='granted')return}
else{fh=await showSaveFilePicker({suggestedName:'SmartComanda.xlsx',types:[{description:'Planilha Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});await idb('put','fh',fh)}
sheet='ok';await push();toast('Planilha conectada. Ela será atualizada a cada alteração.')}catch(e){if(e.name!=='AbortError')toast('Não foi possível conectar a planilha. Use "Baixar planilha agora".')}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)}
/* ---------- telas ---------- */
const SC={Rascunho:'',Pendente:'wn','Em Preparo':'bl',Pronto:'ok'};
function hdr(){const n=S.orders.filter(isLive).length,on=navigator.onLine;
$('#tabs').innerHTML=[['salao','🪑 Salão / Comandas'],['kitchen','🔥 Cozinha (KDS)'],['menu','📖 Cardápio & Turnos']].map(([k,l])=>`<button class="tab ${tab===k?'on '+k:''}" data-a="tab" data-v="${k}">${l}${k==='kitchen'&&n?`<i class="bdg">${n}</i>`:''}</button>`).join('');
const sh={ok:'<span class="chip ok">📊 Planilha sincronizada</span>',busy:'<span class="chip wn">📊 Planilha em uso: feche-a no Excel</span>',unsupported:'<span class="chip">📊 Planilha automática: use Chrome ou Edge</span>',reauth:'<button class="chip wn" data-a="sheet">📊 Reconectar planilha</button>'}[sheet]||'<button class="chip" data-a="sheet">📊 Conectar planilha</button>';
$('#hr').innerHTML=`<span class="chip ${on?'ok':'wn'}">${on?'● Online':'● Offline: tudo salvo neste computador'}</span>${sh}<button class="ic" data-a="snd" title="Som ligado/desligado">${S.cfg.snd?'🔊':'🔇'}</button><button class="ic" data-a="cfg" title="Configurações">⚙</button><span class="turn">Turno <b>${S.turn}</b></span><button class="g" data-a="novo">+ Nova comanda</button>`}
function card(t){const l=S.orders.filter(o=>o.table===t.number&&isLive(o)),st=t.status==='livre'?'livre':l.length?'coz':'ocu';
return`<button class="mesa ${st}${t.number===sel?' sel':''}" data-a="sel" data-v="${t.number}"><b>Mesa ${t.number}</b><span>${t.status==='livre'?'Livre':esc(t.client)}</span>${l.length?tm(l[0]):''}${t.items.length?`<strong>${R(tot(t))}</strong>`:''}</button>`}
function salon(){$('#mesas').innerHTML=`<div class="top"><h2>Mesas e comandas abertas</h2><div class="lg"><span><i class="dot" style="background:var(--g)"></i>Livre</span><span><i class="dot" style="background:var(--a)"></i>Ocupada</span><span><i class="dot" style="background:var(--i)"></i>Aguardando cozinha</span></div></div><div class="grid">${S.tables.map(card).join('')}</div>`;panel()}
function panel(){const t=cur(),p=$('#painel');if(!t){p.innerHTML='<div class="empty">👆<p>Selecione uma mesa para gerenciar a comanda.</p></div>';return}
const dr=t.items.filter(i=>i.status==='Rascunho').length;
p.innerHTML=`<div class="ph"><div><h3>Mesa ${t.number}</h3><small>${esc(t.client)}</small></div><button class="ic" data-a="close" title="Fechar painel">✕</button></div><div class="its">${t.items.length?t.items.map(i=>`<div class="it"><div><b>${i.name}</b><small>${i.qty} × ${R(i.price)}</small></div><div class="r"><b>${R(i.qty*i.price)}</b><span class="chip ${SC[i.status]}">${i.status==='Rascunho'?'Não enviado':i.status}${i.status==='Rascunho'?` <button class="x" data-a="del" data-v="${i.id}" title="Remover">✕</button>`:''}</span></div></div>`).join(''):'<div class="empty">🧾<p>Nenhum item lançado ainda.</p></div>'}</div>
<div class="ft"><div class="tt"><span>Total parcial</span><span>${R(tot(t))}</span></div><button data-a="addm">🛒 Adicionar produtos</button><button class="${dr?'bl':''}" data-a="send"${dr?'':' disabled style="opacity:.45;cursor:default"'}>🔥 Enviar para a cozinha${dr?` (${dr})`:''}</button><button class="g" data-a="pay">💵 Fechar conta / pagamento</button></div>`}
function kds(){const n=Date.now(),L=S.orders.filter(isLive),Rd=S.orders.filter(o=>o.status==='Pronto'&&n-o.readyAt<9e5).reverse();
$('#v-kitchen').innerHTML=`<div class="top"><div><h2>🔥 Monitor de pedidos da cozinha</h2><small>O cronômetro corre desde o envio à cozinha. Avance o status a cada etapa.</small></div><span class="chip">Na fila: <b>${L.length}</b></span></div><div class="kg">${[...L,...Rd].map(o=>`<article class="k${o.status==='Pronto'?' done':''}"><i class="bar ${o.status==='Em Preparo'?'e':o.status==='Pronto'?'p':''}"></i><div class="kt"><b class="mt">Mesa ${o.table}</b>${tm(o)}</div><small>Cliente: ${esc(o.client)}</small><small>Pedido nº ${o.id}, enviado às ${hm(o.sentAt)}</small><ul>${o.items.map(i=>`<li>${i.qty}× ${i.name}</li>`).join('')}</ul>${o.status==='Pendente'?`<button class="bl" data-a="ini" data-v="${o.id}">Iniciar preparo</button>`:o.status==='Em Preparo'?`<button class="g" data-a="pro" data-v="${o.id}">✓ Marcar como pronto</button>`:`<div class="fin">✓ Pronto em ${fmt(el(o))}</div>`}</article>`).join('')||'<div class="empty">Nenhum pedido na fila.</div>'}</div>`}
function menuV(){$('#v-menu').innerHTML=`<div class="top"><div><h2>📖 Cardápio por turnos</h2><small>Mostra os produtos do turno escolhido e as bebidas.</small></div><div class="seg">${TURNOS.map(t=>`<button class="${S.turn===t?'on':''}" data-a="turn" data-v="${t}">${t}</button>`).join('')}</div></div><div class="grid">${MENU.filter(inT).map(p=>`<div class="pc"><div class="r2"><span class="chip">${p.cat}</span><b class="pr">${R(p.price)}</b></div><h4>${p.name}</h4><small>${p.desc}</small></div>`).join('')}</div>`}
function plist(){const t=cur();if(!t)return;$('#pT').textContent='Adicionar produtos: Mesa '+t.number;
$('#pL').innerHTML=[...MENU].sort((a,b)=>inT(b)-inT(a)).map(p=>{const q=t.items.filter(i=>i.name===p.name&&i.status==='Rascunho').reduce((a,i)=>a+i.qty,0);return`<div class="it"><div><b>${p.name}</b><small>${p.cat}: ${R(p.price)}</small></div><button class="g" data-a="add" data-v="${p.id}">+ Adicionar${q?` (${q})`:''}</button></div>`}).join('')}
function render(){hdr();['salao','kitchen','menu'].forEach(k=>$('#v-'+k).hidden=tab!==k);({salao:salon,kitchen:kds,menu:menuV})[tab]()}
/* ---------- ações ---------- */
function st(id,ns){const o=S.orders.find(x=>x.id==id);if(!o)return;o.status=ns;if(ns==='Em Preparo')o.startAt=Date.now();else o.readyAt=Date.now();
S.tables.forEach(t=>t.items.forEach(i=>{if(i.orderId===o.id)i.status=ns}));save();render();ns==='Pronto'?play('ready','Mesa '+o.table+', pedido pronto'):play('start')}
const A={
tab:v=>{tab=v;render()},turn:v=>{S.turn=v;save();render()},sel:v=>{sel=+v;render()},close:()=>{sel=null;render()},
novo:()=>{$('#nNum').value='';$('#nCli').value='';$('#mNew').showModal();$('#nNum').focus()},
abrir:()=>{const n=+$('#nNum').value,c=$('#nCli').value.trim();if(!n||!c){play('err');return toast('Preencha o número da mesa e o nome do cliente.')}
let t=S.tables.find(x=>x.number===n);if(t&&t.status!=='livre'){play('err');return toast('A mesa '+n+' já está ocupada.')}
if(!t){t={number:n,status:'livre',client:'',items:[]};S.tables.push(t);S.tables.sort((a,b)=>a.number-b.number)}
t.status='ocupada';t.client=c;t.items=[];sel=n;save();$('#mNew').close();tab='salao';render();play('open')},
addm:()=>{if(cur()){plist();$('#mProd').showModal()}},
add:v=>{const t=cur(),p=MENU.find(x=>x.id==v),i=t.items.find(x=>x.name===p.name&&x.status==='Rascunho');
if(i)i.qty++;else t.items.push({id:''+Date.now()+Math.random(),name:p.name,qty:1,price:p.price,status:'Rascunho'});t.status='ocupada';save();play('add');render();plist()},
del:v=>{const t=cur();t.items=t.items.filter(i=>i.id!==v);save();render()},
send:()=>{const t=cur(),dr=t.items.filter(i=>i.status==='Rascunho');if(!dr.length)return play('err');
const o={id:++S.seq,table:t.number,client:t.client,sentAt:Date.now(),startAt:0,readyAt:0,status:'Pendente',items:dr.map(i=>({qty:i.qty,name:i.name}))};
dr.forEach(i=>{i.status='Pendente';i.orderId=o.id});S.orders.push(o);save();render();play('send');toast('Pedido nº '+o.id+' enviado. Cronômetro iniciado.')},
pay:()=>{const t=cur(),lv=S.orders.some(o=>o.table===t.number&&isLive(o));
if(!confirm(`Fechar a conta da Mesa ${t.number}: ${R(tot(t))}?`+(t.items.some(i=>i.status==='Rascunho')?'\n\nHá itens NÃO enviados à cozinha.':'')+(lv?'\n\nHá pedidos ainda na cozinha.':'')))return;
S.orders.forEach(o=>{if(o.table===t.number&&isLive(o))o.status='Encerrado'});
if(t.items.length)S.closed.push({at:Date.now(),table:t.number,client:t.client,items:t.items.map(i=>i.qty+'x '+i.name).join('; '),total:tot(t)});
t.status='livre';t.client='';t.items=[];sel=null;save();render();play('cash');toast('Pagamento registrado. Mesa liberada.')},
ini:v=>st(v,'Em Preparo'),pro:v=>st(v,'Pronto'),x:(v,b)=>b.closest('dialog').close(),
snd:()=>{S.cfg.snd=+!S.cfg.snd;save();hdr()},
cfg:()=>{$('#cSnd').checked=!!S.cfg.snd;$('#cVoz').checked=!!S.cfg.voz;$('#cVol').value=S.cfg.vol;$('#cLate').value=S.cfg.late;$('#mCfg').showModal()},
sheet:()=>connect(),dl:()=>download(buildXlsx(),'SmartComanda.xlsx'),test:()=>{play('send');setTimeout(()=>play('ready','Mesa 5, pedido pronto'),900)},
bk:()=>download(new Blob([JSON.stringify(S)],{type:'application/json'}),'backup-smartcomanda-'+new Date().toISOString().slice(0,10)+'.json')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]&&!b.disabled){try{AC().resume()}catch(_){}A[b.dataset.a](b.dataset.v,b)}});
$('#nCli').addEventListener('keydown',e=>{if(e.key==='Enter')A.abrir()});
document.addEventListener('change',e=>{const i=e.target.id;if(i==='cSnd')S.cfg.snd=+e.target.checked;else if(i==='cVoz')S.cfg.voz=+e.target.checked;else if(i==='cVol')S.cfg.vol=+e.target.value;else if(i==='cLate')S.cfg.late=Math.max(1,+e.target.value||15);
else if(i==='cRes'){const f=e.target.files[0];if(!f)return;f.text().then(x=>{const n=JSON.parse(x);if(!n.tables||!n.orders)throw 0;S=n;save();render();toast('Backup restaurado.')}).catch(()=>toast('Arquivo de backup inválido.'));return}else return;save();hdr()});
/* ---------- sincronia entre abas, relógio e atrasos ---------- */
addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;const m=new Map(S.orders.map(o=>[o.id,o.status]));S=JSON.parse(e.newValue);
S.orders.forEach(o=>{const p=m.get(o.id);if(!p)play('send','Novo pedido, mesa '+o.table);else if(p!==o.status&&o.status==='Pronto')play('ready','Mesa '+o.table+', pedido pronto')});render()});
addEventListener('online',hdr);addEventListener('offline',hdr);
let tk=0;setInterval(()=>{const n=Date.now(),L=S.cfg.late*6e4;tk++;
document.querySelectorAll('.tm').forEach(e=>{const o=S.orders.find(x=>x.id==e.dataset.o);if(o){e.className='tm '+cls(o);e.textContent=fmt(el(o))}});
if(tab==='kitchen'){S.orders.forEach(o=>{if(isLive(o)&&!o.alerted&&n-o.sentAt>L){o.alerted=1;save();play('late','Atenção, pedido da mesa '+o.table+' atrasado')}});if(tk%30===0)kds()}},1000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
save();render();initSheet();
</script></body></html>
